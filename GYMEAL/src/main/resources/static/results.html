<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Gymeal </title>
    <style>
        body {
             background-image : url("pictures ressources/Background.png");
            font-family: Verdana, sans-serif;
            text-align: center;
        }

        .box1 {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
        }

        .box2 {
            background: #cbf5cb;
            border-radius: 1.5rem;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
        }
        @keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

    </style>
</head>
<body>

<!-- Fake Loading Modal -->
<div id="loadingModal" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color:  #cbf5cb;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  color:  #black ;
  font-size: 1.5rem;
  font-family: Arial, sans-serif;
">
    <div>
        <div class="loader" style="border: 6px solid #f3f3f3; border-top: 6px solid #4CAF50; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;"></div>
        <p>Loading your personalized meal plan...</p>
    </div>
</div>

<div class="box1">
    <h1>Gymeal</h1>
    <div class="box2" id="dataResult">
        <h2>Information</h2>
        <p style="text-align: left;"><strong>Calories Required:</strong> <span id="calories"></span> kcal</p>
        <p style="text-align: left;"><strong>Proteins Required:</strong> <span id="proteins"></span> g</p>
    </div>
    <div class="box2" id="mealResult">
        <h2>Meals</h2>

        <div id="meal-plan"></div>
        <p>Note...</p>
    </div>
</div>
<script>

   // parsing from  local storage and  send  them to the front.
   const data = JSON.parse(localStorage.getItem('mealPlanData'));
   if (data && data.mealPlan) {
     // Create HTML content based on the meal plan array
     const planHTML = data.mealPlan.map(food =>
  `<p><strong>${food.name}</strong> - ${food.calories} kcal, ${food.protein}g protein, ${food.carbs}g carbs, ${food.fats}g fats</p>`
).join('');


     document.getElementById('meal-plan').innerHTML = planHTML;

   } else {
     document.getElementById('meal-plan').innerHTML = '<p>No meal plan data available.</p>';
   }

    document.addEventListener('DOMContentLoaded', () => {
   const tdee = Number(localStorage.getItem('tdee'));
   const protein = localStorage.getItem('proteinTarget');
   const bmi = localStorage.getItem('bmi');
   const goal = localStorage.getItem('goal');

   let adjustedCalories = tdee;

    switch(goal) {
     case 'deficit':
       adjustedCalories = tdee - 500; // Example for mild deficit
       break;
     case 'moderateDeficit':
       adjustedCalories = tdee - 750;
       break;
     case 'aggressiveDeficit':
       adjustedCalories = tdee - 1000;
       break;
     case 'gain':
       adjustedCalories = tdee + 500;
       break;
     case 'moderateGain':
       adjustedCalories = tdee + 700;
       break;
     case 'aggressiveGain':
       adjustedCalories = tdee + 1000;
       break;
     default:
       adjustedCalories = tdee;
   }

 document.getElementById('calories').textContent = adjustedCalories;
 document.getElementById('proteins').textContent = protein ;});

     setTimeout(() => {
    document.getElementById('loadingModal').style.display = 'none';

    // Now display meal data
    const data = JSON.parse(localStorage.getItem('mealPlanData'));
    if (data && data.mealPlan) {
      const planHTML = data.mealPlan.map(meal => `<p>${meal.name} — ${meal.calories} kcal</p>`).join('');
      document.getElementById('meal-plan').innerHTML = planHTML;
    } else {
      document.getElementById('meal-plan').innerHTML = '<p>No meal plan data available.</p>';
    }
  }, 3000);

</script>
</body>
</html>
