<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Gymeal </title>
    <style>
        body {
            background-color: lightgray;
            font-family: Verdana, sans-serif;
            text-align: center;
        }

        .box1 {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
        }

        .box2 {
            background: lightgray;
            border-radius: 1.5rem;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
<div class="box1">
    <h1>Gymeal</h1>
    <div class="box2" id="dataResult">
        <h2>Information</h2>
        <p style="text-align: left;"><strong>Calories Required:</strong> <span id="calories"></span> kcal</p>
        <p style="text-align: left;"><strong>Proteins Required:</strong> <span id="proteins"></span> g</p>
    </div>
    <div class="box2" id="mealResult">
        <h2>Meals</h2>

        <div id="meal-plan"></div>
    </div>
</div>
<script>

   // parsing from  local storage and  send  them to the front.
   const data = JSON.parse(localStorage.getItem('mealPlanData'));
   if (data && data.mealPlan) {
     // Create HTML content based on the meal plan array
     const planHTML = data.mealPlan.map(meal => `<p>${meal}</p>`).join('');

     document.getElementById('meal-plan').innerHTML = planHTML;

   } else {
     document.getElementById('meal-plan').innerHTML = '<p>No meal plan data available.</p>';
   }

    document.addEventListener('DOMContentLoaded', () => {
   const tdee = Number(localStorage.getItem('tdee'));
   const protein = localStorage.getItem('proteinTarget');
   const bmi = localStorage.getItem('bmi');
   const goal = localStorage.getItem('goal');

   let adjustedCalories = tdee;

    switch(goal) {
     case 'deficit':
       adjustedCalories = tdee - 500; // Example for mild deficit
       break;
     case 'moderateDeficit':
       adjustedCalories = tdee - 750;
       break;
     case 'aggressiveDeficit':
       adjustedCalories = tdee - 1000;
       break;
     case 'gain':
       adjustedCalories = tdee + 500;
       break;
     case 'moderateGain':
       adjustedCalories = tdee + 700;
       break;
     case 'aggressiveGain':
       adjustedCalories = tdee + 1000;
       break;
     default:
       adjustedCalories = tdee;
   }

 document.getElementById('calories').textContent = adjustedCalories;
 document.getElementById('proteins').textContent = protein ;});

</script>
</body>
</html>
